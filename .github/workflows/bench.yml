name: Xtreme-Bench Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Gemini Model identifier'
        required: true
        default: 'gemini-3.8-flash'
        type: choice
        options:
          - 'gemini-3.8-flash'
          - 'gemini-3.1-pro-preview'
          - 'gemini-3.5-flash-lite'
      language:
        description: 'Solution Language'
        required: true
        default: 'cpp'
        type: choice
        options:
          - 'cpp'
          - 'python'
      samples:
        description: 'Samples per problem (for Pass@k)'
        required: true
        default: '1'
        type: string
      difficulty:
        description: 'Filter difficulties (leave blank for all, or e.g. TUTORIAL EASY)'
        required: false
        default: ''
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify g++ Compiler
        run: |
          g++ --version
          which g++

      - name: Run Xtreme-Bench Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--model ${{ inputs.model }} --language ${{ inputs.language }} --samples ${{ inputs.samples }} --delay 2"
          if [ -n "${{ inputs.difficulty }}" ]; then
            ARGS="$ARGS --difficulty ${{ inputs.difficulty }}"
          fi
          uv run scripts/eval_bench.py $ARGS

      - name: Upload Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ inputs.model }}-${{ inputs.language }}
          path: |
            benchmarks/runs/*.jsonl
            benchmarks/runs/*_metrics.json
            benchmarks/LEADERBOARD.md

      - name: Commit Leaderboard Update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(bench): update LEADERBOARD.md for ${{ inputs.model }} (${{ inputs.language }})"
          file_pattern: "benchmarks/LEADERBOARD.md benchmarks/runs/*_metrics.json"
